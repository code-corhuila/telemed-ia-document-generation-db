databaseChangeLog:
  - changeSet:
      id: dcl-grants-001
      author: telemed
      labels: "HU-016,dcl,grants"
      comment: "Grant reader/writer privileges on document_generation tables to the roles created by infra."
      changes:
        - sqlFile:
            path: 001_grants.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/001_grants.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-002
      author: telemed
      labels: "HU-016,dcl,grants"
      comment: "Grant reader/writer privileges on idempotency_key, missed by dcl-grants-001 because default privileges do not apply to existing tables."
      changes:
        - sqlFile:
            path: 002_grant_idempotency_key.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/002_grant_idempotency_key.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-003
      author: telemed
      labels: "HU-016,dcl,grants,outbox"
      comment: "Grant reader/writer privileges on outbox_event."
      changes:
        - sqlFile:
            path: 003_grant_outbox_event.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/003_grant_outbox_event.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
